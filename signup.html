<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WILDFIRE - VIP Sign Up</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif}
body{background:radial-gradient(circle at center, #1f140a 0%, #080706 100%);color:#f0f0f0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{width:100%;max-width:400px;background:rgba(20, 16, 12, 0.88);backdrop-filter:blur(12px);padding:30px 22px;border-radius:18px;border:1px solid rgba(255, 120, 0, 0.35);box-shadow:0 15px 35px rgba(0,0,0,0.9), 0 0 25px rgba(255, 100, 0, 0.2)}
.logo-container{text-align:center;margin-bottom:15px}
.logo-img{width:110px;height:110px;object-fit:cover;border-radius:50%;border:2px solid #ff8c00;box-shadow:0 0 20px rgba(255, 100, 0, 0.5)}
.vip-badge{display:inline-block;background:linear-gradient(135deg, #ff8c00, #ff4500, #d4af37);color:#000;font-size:11px;font-weight:900;letter-spacing:1.5px;padding:4px 14px;border-radius:20px;text-transform:uppercase;margin-bottom:10px}
h2{color:#fff;font-size:24px;font-weight:800;margin-bottom:20px;text-align:center;letter-spacing:1.5px;text-transform:uppercase}
h2 span{color:#ff7700;text-shadow:0 0 10px rgba(255,119,0,0.6)}
.input-group{margin-bottom:15px}
input{width:100%;padding:14px;background:rgba(12, 10, 8, 0.8);border:1px solid #33261c;border-radius:10px;color:#fff;font-size:15px;outline:none;transition:all 0.3s ease}
input:focus{border-color:#ff7700;box-shadow:0 0 12px rgba(255, 119, 0, 0.4)}
button.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg, #ff8c00 0%, #e63900 100%);border:none;border-radius:10px;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;transition:all 0.3s ease;box-shadow:0 4px 18px rgba(255, 69, 0, 0.4);letter-spacing:1px;text-transform:uppercase}
button.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(255, 100, 0, 0.6);background:linear-gradient(135deg, #ffa31a 0%, #ff4500 100%)}
.link-btn{width:100%;background:transparent;border:none;color:#ff8c00;text-decoration:none;cursor:pointer;margin-top:16px;font-size:14px;transition:color 0.3s ease;display:block;text-align:center}
.link-btn:hover{color:#fff;text-decoration:underline}
#msg{text-align:center;margin-top:15px;font-size:14px;min-height:20px;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<div class="logo-container">
<img src="logo.jpg" alt="WILDFIRE Logo" class="logo-img">
</div>
<div style="text-align:center;"><span class="vip-badge">JOIN THE CLUB</span></div>
<h2>CREATE <span>VIP ACCOUNT</span></h2>
<div class="input-group">
<input type="text" id="username" placeholder="Username">
</div>
<div class="input-group">
<input type="email" id="email" placeholder="Email Address">
</div>
<div class="input-group">
<input type="password" id="password" placeholder="Password">
</div>
<button class="btn-primary" onclick="signup()">Create VIP Account</button>
<button class="link-btn" onclick="goToLogin()">Back to Login</button>
<p id="msg"></p>
</div>
<script>
function signup(){
let u = document.getElementById('username').value.trim();
let e = document.getElementById('email').value.trim();
let p = document.getElementById('password').value.trim();
let msg = document.getElementById('msg');

if(!u || !e || !p){
msg.style.color = '#ff4d4d';
msg.innerText = 'Please fill all fields';
return;
}

let users = JSON.parse(localStorage.getItem('shahan_users_db')) || [];
let exists = users.some(user => user.email === e || user.username === u);

if(exists){
msg.style.color = '#ff4d4d';
msg.innerText = 'Username or Email already exists';
return;
}

users.push({username: u, email: e, password: p});
localStorage.setItem('shahan_users_db', JSON.stringify(users));

let members = localStorage.getItem('shahan_members') ? parseInt(localStorage.getItem('shahan_members')) : 150;
localStorage.setItem('shahan_members', members + 1);

msg.style.color = '#00e676';
msg.innerText = 'VIP Account created successfully! Redirecting...';

setTimeout(() => {
window.location.href = 'index.html';
}, 1500);
}
function goToLogin(){
window.location.href = 'index.html';
}
</script>
</body>
</html>
