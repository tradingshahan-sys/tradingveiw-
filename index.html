<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>twanafx - Login</title>
<style>
body{font-family:Arial,sans-serif;background:#121212;color:#fff;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh}
.container{width:100%;max-width:400px;background:#1e1e1e;padding:25px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
input,button{width:100%;padding:12px;margin:10px 0;border:none;border-radius:4px;box-sizing:border-box}
input{background:#2a2a2a;color:#fff;font-size:16px}
button{background:#4CAF50;color:#fff;font-weight:bold;cursor:pointer;font-size:16px}
button:hover{background:#45a049}
.link-btn{background:transparent;color:#4CAF50;text-decoration:underline;cursor:pointer;margin-top:5px}
#error-msg{color:#f44336;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h2>ShahanFx Login</h2>
<input type="text" id="email" placeholder="Email / Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
<button class="link-btn" onclick="goToSignup()">Create new account (Sign Up)</button>
<p id="error-msg"></p>
</div>
<script>
function login(){
let e = document.getElementById('email').value.trim();
let p = document.getElementById('password').value.trim();
let err = document.getElementById('error-msg');

if((e === 'twanafx' || e === 'twanafx@gmail.com') && p === 'twanafx'){
localStorage.setItem('shahan_logged', 'admin');
localStorage.setItem('shahan_user', 'twanafx');
window.location.href = 'dashboard.html';
return;
}

let users = JSON.parse(localStorage.getItem('shahan_users_db')) || [];
let foundUser = users.find(u => (u.email === e || u.username === e) && u.password === p);

if(foundUser){
localStorage.setItem('shahan_logged', 'user');
localStorage.setItem('shahan_user', foundUser.username);
window.location.href = 'dashboard.html';
} else {
err.innerText = 'Invalid email/username or password';
}
}
function goToSignup(){
window.location.href = 'signup.html';
}
window.onload = function(){
let status = localStorage.getItem('shahan_logged');
if(status === 'admin' || status === 'user'){
window.location.href = 'dashboard.html';
}
}
</script>
</body>
</html>
